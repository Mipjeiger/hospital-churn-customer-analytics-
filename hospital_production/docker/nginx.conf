server {
    listen 8085;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prometheus metrics endpoint for frontend web container
    location = /metrics {
        default_type text/plain;
        return 200 "# HELP frontend_up Indicates if the frontend static server is running\n# TYPE frontend_up gauge\nfrontend_up 1\n";
    }

    # Optional: basic nginx status
    location = /stub_status {
        stub_status;
        access_log off;
    }

    # React Router — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
