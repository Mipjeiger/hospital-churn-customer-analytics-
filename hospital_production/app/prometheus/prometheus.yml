global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hospital_api"
    static_configs:
      - targets: ["fastapi:8000"]

  - job_name: "prefect_metrics"
    static_configs:
      - targets: ["fastapi:8001"]

  - job_name: "prefect"
    static_configs:
      - targets: ["prefect:4200"]

rule_files:
  - /etc/prometheus/alerts.yml