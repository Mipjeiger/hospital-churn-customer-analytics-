server {
    listen 8085;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prometheus metrics endpoint for frontend web container
    location = /metrics {
        default_type text/plain;
        return 200 "# HELP frontend_up Indicates if the frontend static server is running\n# TYPE frontend_up gauge\nfrontend_up 1\n";
    }

    # Optional: basic nginx status
    location = /stub_status {
        stub_status;
        access_log off;
    }

    # Reverse proxy API requests to FastAPI container
    location /api/ {
        proxy_pass http://fastapi:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # React Router — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
