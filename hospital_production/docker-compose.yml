services:

  postgres:
    image: postgres:15
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hospital_network

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
    networks:
      - hospital_network

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001" --license /minio.license
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ./minio.license:/minio.license:ro
    networks:
      - hospital_network
    
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0-full
    container_name: mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --allowed-hosts '*'
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://hospital-models/mlflow/
      --serve-artifacts
    ports:
      - "5002:5000"
    env_file:
      - .env
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      - postgres
      - minio
    networks:
      - hospital_network

  langfuse-db:
    image: postgres:16
    container_name: langfuse-db
    environment:
      POSTGRES_USER: ${LANGFUSE_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_DB}
    ports:
      - "5433:5432"
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    networks:
      - hospital_network

  langfuse:
    image: langfuse/langfuse:latest
    container_name: langfuse
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_USER}:${LANGFUSE_PASSWORD}@langfuse-db:5432/${LANGFUSE_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
    ports:
      - "4000:3000"
    depends_on:
      - langfuse-db
    networks:
      - hospital_network

  prefect:
    image: prefecthq/prefect:3-python3.11
    container_name: prefect
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
  
volumes:
  pgdata:
  minio_data:
  mlflow_data:
  langfuse_data:

networks:
  hospital_network:
    name: hospital_network
    driver: bridge