services:

  postgres:
    image: postgres:15
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_DB}, ${LANGFUSE_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - hospital_network

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: fastapi
    dns:
      - 182.8.64.6
      - 182.12.0.5
    env_file: .env
    environment:
      # PostgreSQL configuration
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # LLM API keys
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY}
      # Feast configuration
      FEAST_REPO_PATH: /app/app/feast
      # MinIO & MLflow configuration
      MINIO_ENDPOINT: minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      PROMETHEUS_EXPORTER_PORT: 8001
      ENABLE_PROMETHEUS_EXPORTER: "true"
      PREFECT_API_URL: http://prefect:4200/api
      # Langfuse configuration
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_BASE_URL: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://langfuse:3000/api/public/otel
    ports:
      - "8000:8000" # Expose FastAPI endpoint
    expose:
      - "8001"
    volumes:
      - .:/app
      - .:/app/feast:/app/app/feast
      - .:/app/feast/data:/app/app/feast/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - mlflow
    networks:
      - hospital_network

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001" --license /minio.license
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ./minio.license:/minio.license:ro
    networks:
      - hospital_network
    
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0-full
    container_name: mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --allowed-hosts '*'
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://hospital-models/mlflow/
      --serve-artifacts
    ports:
      - "5002:5000"
    env_file:
      - .env
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - mlflow_data:/mlflow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - minio
    networks:
      - hospital_network

  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: clickhouse
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"
      - "9003:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - hospital_network

  langfuse:
    image: langfuse/langfuse:latest
    container_name: langfuse
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${LANGFUSE_USER}:${LANGFUSE_PASSWORD}@postgres:5432/${LANGFUSE_DB}
      - CLICKHOUSE_URL=http://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      - CLICKHOUSE_MIGRATION_URL=clickhouse://:${CLICKHOUSE_PASSWORD}@clickhouse:9000/${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD}
      - LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID}
      - SALT=${SALT}
    ports:
      - "4000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - clickhouse
    networks:
      - hospital_network

  prefect:
    image: prefecthq/prefect:3-python3.11
    container_name: prefect
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      - PREFECT_API_DATABASE_TIMEOUT=30
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_ANALYTICS_ENABLED=false
      - PREFECT_SERVER_UI_API_URL=http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - hospital_network
  
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "9091:9091"
    networks:
      - hospital_network
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./app/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./app/grafana/provisioning/rules/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - hospital_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./app/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./app/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - pushgateway
    networks:
      - hospital_network

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: streamlit
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
      POSTGRES_TABLE: ${POSTGRES_TABLE}
      API_BASE_URL: http://fastapi:8000
    ports:
      - "8501:8501"
      - "8502:8502"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - fastapi
    networks:
      - hospital_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - hospital_network
    depends_on:
      - fastapi

volumes:
  pgdata:
  minio_data:
  mlflow_data:
  clickhouse_data:
  langfuse_data:
  prefect_data:
  prometheus_data:
  grafana_data:

networks:
  hospital_network:
    name: hospital_network
    driver: bridge
